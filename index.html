<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モダンポジティブ小倉百人一首 v1.18</title>
    <style>
        :root {
            --fade-duration: 1.5s;
            --text-delay-step: 1.8s;
        }

        @keyframes background-pan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes text-fade-in {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            color: #e0e0e0;
            font-family: 'serif', 'MS Mincho', 'Hiragino Mincho ProN', sans-serif;
            overflow: hidden;
        }
        
        body {
            background: linear-gradient(270deg, #0a0a1a, #1a0a1a, #0a1a0a);
            background-size: 600% 600%;
            animation: background-pan 30s ease infinite;
        }

        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a1a;
            opacity: 0;
            pointer-events: none;
            z-index: 99;
            transition: opacity 1.5s ease;
        }

        #fade-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        #main-title {
            font-size: 3.5vw;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .description {
            font-size: 1vw;
            color: #aaa;
            max-width: 800px;
            text-align: center;
            line-height: 1.7;
            margin-top: 30px;
        }

        #start-button {
            padding: 20px 40px;
            font-size: 2rem;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid #fff;
            border-radius: 10px;
            transition: background-color 0.3s, transform 0.3s, opacity 0.5s;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            margin-top: 30px;
        }

        #start-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #karuta-display {
            position: absolute;
            width: 90%;
            max-width: 1200px;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
        }

        #karuta-display.visible {
            opacity: 1;
        }

        #karuta-display p {
            margin: 0;
            opacity: 0;
            white-space: pre-wrap;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        #karuta-display.visible p {
            animation: text-fade-in 2s ease-out forwards;
        }

        #karuta-display.visible #waka { animation-delay: var(--text-delay-step); }
        #karuta-display.visible #gendaigo_caption { animation-delay: calc(var(--text-delay-step) * 2); }
        #karuta-display.visible #gendaigo { animation-delay: calc(var(--text-delay-step) * 2.2); }
        #karuta-display.visible #positive_y_caption { animation-delay: calc(var(--text-delay-step) * 3.2); }
        #karuta-display.visible #positive_y { animation-delay: calc(var(--text-delay-step) * 3.4); }
        #karuta-display.visible #positive_x_caption { animation-delay: calc(var(--text-delay-step) * 4.4); }
        #karuta-display.visible #positive_x { animation-delay: calc(var(--text-delay-step) * 4.6); }

        #number {
            font-size: 1.8vw;
            margin-bottom: 0.5vh;
            color: #aaa;
        }
        #kajin {
            font-size: 1.8vw;
            margin-bottom: 2vh;
            color: #bbb;
        }
        #waka {
            font-size: 4vw;
            font-weight: bold;
            margin-bottom: 3vh;
            line-height: 1.6;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }
        #gendaigo, #positive_x, #positive_y {
            font-size: 1.6vw;
            margin-top: 0.5vh;
            line-height: 1.7;
            color: #ccc;
        }
        
        .caption {
            font-size: 1.4vw;
            color: #999;
            margin-top: 2vh;
            margin-bottom: 0;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            z-index: 100;
        }

        footer a {
            color: #aaa;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            #main-title { font-size: 6vw; }
            .description { font-size: 2.5vw; }
            #number { font-size: 3.5vw; }
            #kajin { font-size: 3.5vw; }
            #waka { font-size: 7vw; }
            #gendaigo, #positive_x, #positive_y { font-size: 4vw; }
            .caption { font-size: 3vw; }
        }
    </style>
</head>
<body>
    <div id="fade-overlay"></div>

    <div id="container">
        <div id="karuta-display">
            <p id="number"></p>
            <p id="kajin"></p>
            <p id="waka"></p>
            <p class="caption" id="gendaigo_caption"></p>
            <p id="gendaigo"></p>
            <p class="caption" id="positive_y_caption"></p>
            <p id="positive_y"></p>
            <p class="caption" id="positive_x_caption"></p>
            <p id="positive_x"></p>
        </div>
        <h1 id="main-title">モダンポジティブ小倉百人一首</h1>
        <button id="start-button">Start</button>
        <p class="description">
            これは作業用スクリーンセーバーwebアプリ。<br>
            百人一首が好きだ。だけど現代に伝わる一般的な解釈は、ことさらに言葉の裏を想像してメランコリックになったり厭世的になったり、ネガティブなものが多すぎる。<br>
            いいじゃん、この素晴らしい文学からポジティブなニュアンスだけ摂取しても。もしかしたら詠んだ当人だって、そこまで後ろ向きなニュアンスは意図してなかったのかもしれないよ。AIに小倉百人一首を前向きに解釈してもらって、晴れやかに楽しもう！<br>
            <br>
            ※スマートフォンの縦長画面での使用を推奨。<br>
        </p>
    </div>

    <footer>
        <a href="https://x.com/qurihara" target="_blank" rel="noopener noreferrer">© Kazutaka Kurihara</a>
        <a href="https://github.com/qurihara/alt_hyakunin_isshu" target="_blank" rel="noopener noreferrer">Github Repository</a>
    </footer>

    <script>
        const karutaData = [];
        const csvPath1 = './小倉百人一首現代解釈.csv';
        const csvPath2 = './scripts/waka.csv';

        const container = document.getElementById('container');
        const mainTitle = document.getElementById('main-title');
        const startButton = document.getElementById('start-button');
        const description = document.querySelector('.description');
        const display = document.getElementById('karuta-display');
        const numberEl = document.getElementById('number');
        const kajinEl = document.getElementById('kajin');
        const wakaEl = document.getElementById('waka');
        const gendaigoCaptionEl = document.getElementById('gendaigo_caption');
        const gendaigoEl = document.getElementById('gendaigo');
        const positiveXCaptionEl = document.getElementById('positive_x_caption');
        const positiveXEl = document.getElementById('positive_x');
        const positiveYCaptionEl = document.getElementById('positive_y_caption');
        const positiveYEl = document.getElementById('positive_y');
        const footer = document.querySelector('footer');
        
        const fadeOverlay = document.getElementById('fade-overlay');

        let isRunning = false;
        let isFirstPlay = true;
        let sequenceTimeout;

        async function loadData() {
            try {
                const [response1, response2] = await Promise.all([
                    fetch(csvPath1),
                    fetch(csvPath2)
                ]);

                if (!response1.ok || !response2.ok) {
                    throw new Error('CSVの読み込みに失敗しました。');
                }

                const text1 = await response1.text();
                const text2 = await response2.text();
                
                const parseCsv = (text) => {
                    const textWithoutBom = text.charCodeAt(0) === 0xFEFF ? text.substring(1) : text;
                    return textWithoutBom.split(/\r?\n/).slice(1);
                };

                const lines1 = parseCsv(text1);
                const lines2 = parseCsv(text2);

                const wakaMap = new Map();
                lines2.forEach(line => {
                    const columns = line.split(',');
                    if (columns.length >= 7) {
                        const [num, kajin, waka, gendaigo, , , positive_y] = columns;
                        if (num && num.trim()) {
                            const wakaParts = waka.trim().split(/\s+/);
                            const newWaka = (wakaParts.length === 5)
                                ? [ wakaParts[0], `${wakaParts[1]} ${wakaParts[2]}`, wakaParts[3], wakaParts[4] ].join('\n')
                                : waka.trim().replace(/ /g, '\n');

                            wakaMap.set(num.trim(), { 
                                kajin: kajin.trim(),
                                waka: newWaka,
                                gendaigo: gendaigo.trim(),
                                positive_y: positive_y.trim()
                            });
                        }
                    }
                });

                karutaData.push({
                    number: '0',
                    kajin: '王仁',
                    waka: '難波津に\n咲くやこの花 冬ごもり\n今は春べと\n咲くやこの花',
                    gendaigo: '難波津に、冬の間は籠っていた花が咲いている。さあ、春になったのだと、花が咲いているよ。',
                    positive_x: '長い冬が終わり、ついに春が来た！待ちわびた花が咲き誇るように、あなたも今こそ開花の時です。',
                    positive_y: '厳しい冬を耐え抜いた花が、春の訪れと共に一斉に咲き誇るように、あなたの努力も必ず開花の時を迎えます。希望を持って、新しい季節の一歩を踏み出しましょう。'
                });

                lines1.forEach(line => {
                    const columns = line.split(',');
                    if (columns.length >= 4) {
                        const [num, , , positive_x] = columns;
                        const wakaInfo = wakaMap.get(num.trim());
                        if (num && num.trim() && wakaInfo) {
                            karutaData.push({
                                number: num.trim(),
                                kajin: wakaInfo.kajin,
                                waka: wakaInfo.waka,
                                gendaigo: wakaInfo.gendaigo,
                                positive_x: positive_x.trim(),
                                positive_y: wakaInfo.positive_y
                            });
                        }
                    }
                });

                 if (karutaData.length <= 1) {
                    throw new Error('CSVデータが空か、パースに失敗しました。');
                }
            } catch (error) {
                console.error(error);
                display.innerHTML = `<p style="opacity:1; color:red;">${error.message}</p>`;
                display.classList.add('visible');
                return false;
            }
            return true;
        }
        
        function setKarutaText(karuta) {
            numberEl.textContent = karuta.number === '0' ? '序歌' : `#${karuta.number}`;
            kajinEl.textContent = karuta.kajin;
            wakaEl.textContent = karuta.waka;
            gendaigoCaptionEl.textContent = '【一般的な現代語訳】';
            gendaigoEl.textContent = karuta.gendaigo;
            positiveXCaptionEl.textContent = '【情熱モダンポジティブ解釈】';
            positiveXEl.textContent = karuta.positive_x;
            positiveYCaptionEl.textContent = '【おだやかモダンポジティブ解釈】';
            positiveYEl.textContent = karuta.positive_y;
        }

        async function sequence() {
            if (!isRunning) return;

            if (!isFirstPlay) {
                fadeOverlay.classList.add('visible');
                await new Promise(resolve => setTimeout(resolve, 1500));
                display.classList.remove('visible');
            }

            let karuta;
            if (isFirstPlay) {
                karuta = karutaData.find(k => k.number === '0');
            } else {
                const regularKaruta = karutaData.slice(1);
                karuta = regularKaruta[Math.floor(Math.random() * regularKaruta.length)];
            }
            
            if (karuta) {
                setKarutaText(karuta);
            }

            if (isFirstPlay) {
                isFirstPlay = false;
                display.classList.add('visible'); 
            } else {
                fadeOverlay.classList.remove('visible');
                setTimeout(() => {
                    display.classList.add('visible');
                }, 100);
            }
            
            await new Promise(resolve => {
                sequenceTimeout = setTimeout(resolve, 25000);
            });

            if (isRunning) {
                sequence();
            }
        }

        startButton.addEventListener('click', async () => {
            if (isRunning) return;
            
            // ボタンを操作不能にし、即座にフェードアウトを開始
            startButton.disabled = true;
            startButton.style.transition = 'opacity 0.5s';
            startButton.style.opacity = '0';
            
            // フェードアウト完了後に display:none にする
            setTimeout(() => {
                startButton.style.display = 'none';
            }, 500);

            const loaded = await loadData();

            if (loaded) {
                isRunning = true;
                mainTitle.style.display = 'none';
                description.style.display = 'none';
                footer.style.display = 'none';
                sequence();
            } else {
                // エラーが起きたら元に戻す
                startButton.style.display = 'block'; // 再表示
                startButton.disabled = false;
                startButton.style.opacity = '1';
                startButton.textContent = 'エラーが発生しました';
            }
        });
    </script>
</body>
</html>
